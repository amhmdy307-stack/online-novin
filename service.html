{% extends 'base.html' %}{% block content %}<h1>{{service.name}}</h1><p>{{service.description}}</p><form method="post" enctype="multipart/form-data"><h3>اطلاعات پرونده مشتری</h3><div class="field"><label>نام و نام خانوادگی</label><input name="name" required></div><div class="field"><label>کد ملی</label><input name="national_id" inputmode="numeric" required></div><div class="field"><label>تلفن</label><input name="phone" inputmode="tel" required></div>{% for f in fields %}<div class="field"><label>{{f.label}}{% if f.required %} *{% endif %}</label>{% if f.type=='select' %}<select name="{{f.name}}" {% if f.required %}required{% endif %}>{% for o in f.options %}<option value="{{o}}">{{o}}</option>{% endfor %}</select>{% elif f.type=='file' %}<input type="file" name="{{f.name}}" {% if f.required %}required{% endif %}>{% else %}<input type="{{'date' if f.type=='date' else 'text'}}" name="{{f.name}}" {% if f.required %}required{% endif %}>{% endif %}</div>{% endfor %}<div class="notice">هزینه این خدمت: {{ "{:,}".format(service.price) }} ریال</div><button class="btn">ثبت درخواست</button></form>{% endblock %}
