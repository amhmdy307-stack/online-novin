{% extends 'base.html' %}{% block content %}<h1>خدمات آنلاین</h1><div class="notice">⚠️ پرداخت خدمات فقط از طریق درگاه رسمی سایت انجام می‌شود.</div>{% for s in services %}<div class="card"><h2>{{s.name}}</h2><p>{{s.description}}</p><p>قیمت: {{ "{:,}".format(s.price) }} ریال</p><a class="btn" href="{{url_for('service',sid=s.id)}}">ثبت درخواست</a></div>{% else %}<p>هنوز خدمتی فعال نشده است.</p>{% endfor %}{% endblock %}
