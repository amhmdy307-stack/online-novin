{% extends "base.html" %}
{% block title %}فراموشی رمز{% endblock %}
{% block content %}
<div class="card" style="max-width:460px;margin:40px auto;">
    <h1 style="text-align:center;">بازیابی رمز</h1>
    {% if step != 'reset' %}
    <form method="POST">
        <input type="hidden" name="action" value="send_code">
        <label>نام کاربری</label>
        <input type="text" name="username" required>
        <button type="submit" class="btn" style="width:100%;">ارسال کد پیامک</button>
    </form>
    {% else %}
    <form method="POST">
        <input type="hidden" name="action" value="reset">
        <input type="hidden" name="username" value="{{ username }}">
        <label>کد پیامک</label>
        <input type="text" name="code" required maxlength="6" inputmode="numeric">
        <label>رمز جدید</label>
        <div class="password-wrap">
            <input type="password" id="p1" name="password" required minlength="6">
            <button type="button" class="toggle-eye" onclick="togglePass('p1', this)">👁</button>
        </div>
        <label>تکرار رمز</label>
        <div class="password-wrap">
            <input type="password" id="p2" name="password2" required minlength="6">
            <button type="button" class="toggle-eye" onclick="togglePass('p2', this)">👁</button>
        </div>
        <button type="submit" class="btn" style="width:100%;">ثبت رمز جدید</button>
    </form>
    {% endif %}
    <p style="text-align:center;margin-top:14px;"><a href="{{ url_for('admin_login') }}">بازگشت</a></p>
</div>
{% endblock %}
{% block scripts %}
<script>
function togglePass(id, btn) {
    var el = document.getElementById(id);
    if (!el) return;
    if (el.type === "password") { el.type = "text"; btn.textContent = "🙈"; }
    else { el.type = "password"; btn.textContent = "👁"; }
}
</script>
{% endblock %}
