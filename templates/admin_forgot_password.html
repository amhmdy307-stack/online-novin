{% extends "base.html" %}
{% block title %}فراموشی رمز{% endblock %}

{% block content %}
<div class="card" style="max-width:480px;margin:40px auto;">
    <h1 style="text-align:center;">بازیابی رمز عبور</h1>
    <p style="text-align:center;color:#64748b;">کد تأیید به موبایل ثبت‌شده در پنل پیامک می‌شود.</p>

    {% if step != 'reset' %}
    <form method="POST">
        <input type="hidden" name="action" value="send_code">
        <label>نام کاربری</label>
        <input type="text" name="username" required placeholder="نام کاربری مدیر یا کارشناس">
        <button type="submit" class="btn" style="width:100%;">ارسال کد با پیامک</button>
    </form>
    {% else %}
    <form method="POST">
        <input type="hidden" name="action" value="reset">
        <input type="hidden" name="username" value="{{ username }}">
        <label>کد پیامک‌شده</label>
        <input type="text" name="code" required inputmode="numeric" maxlength="6" placeholder="کد ۶ رقمی">

        <label>رمز جدید</label>
        <div class="password-wrap">
            <input type="password" id="new-pass" name="password" required minlength="6" placeholder="حداقل ۶ کاراکتر">
            <button type="button" class="toggle-eye" onclick="togglePass('new-pass', this)">👁</button>
        </div>

        <label>تکرار رمز جدید</label>
        <div class="password-wrap">
            <input type="password" id="new-pass2" name="password2" required minlength="6">
            <button type="button" class="toggle-eye" onclick="togglePass('new-pass2', this)">👁</button>
        </div>

        <button type="submit" class="btn" style="width:100%;">ثبت رمز جدید</button>
    </form>
    {% endif %}

    <p style="text-align:center;margin-top:16px;">
        <a href="{{ url_for('admin_login') }}">بازگشت به ورود</a>
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
function togglePass(id, btn) {
    var el = document.getElementById(id);
    if (!el) return;
    if (el.type === "password") {
        el.type = "text";
        btn.textContent = "🙈";
    } else {
        el.type = "password";
        btn.textContent = "👁";
    }
}
</script>
{% endblock %}
