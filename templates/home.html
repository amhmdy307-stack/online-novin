{% extends "base.html" %}

{% block content %}

<style>
    .landing {
        min-height: 75vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .landing-card {
        width: 100%;
        max-width: 650px;
        background: #ffffff;
        border-radius: 24px;
        padding: 35px 25px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(0,0,0,.10);
    }

    .landing-logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
        margin-bottom: 15px;
    }

    .landing-card h1 {
        margin: 5px 0 10px;
        color: #102a43;
        font-size: 28px;
    }

    .landing-description {
        color: #596579;
        font-size: 16px;
        margin-bottom: 8px;
    }

    .manager {
        color: #333;
        font-weight: bold;
        margin: 18px 0 5px;
    }

    .phone {
        color: #1479d1;
        font-weight: bold;
        direction: ltr;
        margin-bottom: 28px;
    }

    .landing-buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
    }

    .landing-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 58px;
        border-radius: 12px;
        text-decoration: none;
        color: #fff !important;
        font-weight: bold;
        font-size: 14px;
        transition: .2s;
    }

    .landing-btn:hover {
        transform: translateY(-2px);
        opacity: .9;
    }

    .customer-btn {
        background: #1479d1;
    }

    .admin-btn {
        background: #102a43;
    }

    .tracking-btn {
        background: #263238;
    }

    @media (max-width: 650px) {
        .landing {
            min-height: 70vh;
        }

        .landing-card {
            padding: 28px 18px;
        }

        .landing-buttons {
            grid-template-columns: 1fr;
        }

        .landing-btn {
            min-height: 55px;
        }
    }
</style>

<div class="landing">

    <div class="landing-card">

        {% if settings and settings.get('logo') %}
            <img
                class="landing-logo"
                src="{{ url_for('uploaded_file', filename=settings.get('logo')) }}"
                alt="لوگوی کافی‌نت آنلاین نوین"
            >
        {% endif %}

        <h1>کافی‌نت آنلاین نوین</h1>

        <div class="landing-description">
            ارائه خدمات اینترنتی و ثبت درخواست به صورت آنلاین
        </div>

        <div class="manager">
            مدیریت: احمد محمدی مهر
        </div>

        <div class="phone">
            📞 09920345139
        </div>

        <div class="landing-buttons">

            <a
                href="{{ url_for('customer_login') }}"
                class="landing-btn customer-btn"
            >
                👤 ورود به پنل مشتری
            </a>

            <a
                href="{{ url_for('admin_login') }}"
                class="landing-btn admin-btn"
            >
                🔐 ورود مدیریت
            </a>

            <a
                href="{{ url_for('tracking') }}"
                class="landing-btn tracking-btn"
            >
                🔎 پیگیری درخواست
            </a>

        </div>

    </div>

</div>

{% endblock %}
