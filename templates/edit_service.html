{% extends "base.html" %}
{% block body_class %}admin-page{% endblock %}
{% block title %}ویرایش خدمت{% endblock %}

{% block content %}
<div class="card">
    <a href="{{ url_for('admin') }}" class="btn btn-secondary">بازگشت به پنل</a>
    <h2>ویرایش خدمت</h2>
    <form method="POST">
        <label>نام خدمت *</label>
        <input type="text" name="name" value="{{ service.name }}" required>

        <label>دسته‌بندی</label>
        <input type="text" name="category" value="{{ service.category or '' }}">

        <label>توضیحات</label>
        <textarea name="description">{{ service.description or '' }}</textarea>

        <label>قیمت (تومان)</label>
        <input type="number" name="price" value="{{ service.price or 0 }}" min="0">

        <label>ترتیب</label>
        <input type="number" name="sort_order" value="{{ service.sort_order or 0 }}">

        <label>وضعیت</label>
        <select name="active">
            <option value="1" {% if service.active %}selected{% endif %}>فعال</option>
            <option value="0" {% if not service.active %}selected{% endif %}>غیرفعال</option>
        </select>

        <label>فیلدهای فرم (JSON)</label>
        <textarea name="fields_json">{{ service.fields_json or '[]' }}</textarea>

        <label>مدارک (JSON)</label>
        <textarea name="documents_json">{{ service.documents_json or '[]' }}</textarea>

        <button type="submit" class="btn">ذخیره تغییرات</button>
    </form>
</div>
{% endblock %}
