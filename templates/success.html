{% extends 'base.html' %}

{% block content %}

<div class="card" style="max-width:650px;margin:40px auto;text-align:center;">

    <h1>✅ درخواست شما با موفقیت ثبت شد</h1>

    <p>
        درخواست شما با موفقیت در سیستم کافی‌نت آنلاین نوین ثبت شد.
    </p>

    <div class="notice" style="margin:25px 0;">

        <h2>کد پیگیری شما</h2>

        <div style="
            font-size:28px;
            font-weight:bold;
            direction:ltr;
            letter-spacing:2px;
            margin:15px 0;
        ">
            {{ code }}
        </div>

        <p>
            این کد را برای پیگیری درخواست خود نگه دارید.
        </p>

    </div>

    <a class="btn" href="/tracking">
        پیگیری درخواست
    </a>

    <a class="btn" href="/customer/login">
        ورود به پنل مشتری
    </a>

    <a class="btn" href="/">
        بازگشت به خدمات
    </a>

</div>

{% endblock %}
