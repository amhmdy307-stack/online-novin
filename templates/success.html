{% extends "base.html" %}

{% block title %}
ثبت موفق درخواست
{% endblock %}

{% block content %}

<div
    class="card"
    style="text-align:center;"
>

    <div style="font-size:60px;">
        ✅
    </div>

    <h1>
        درخواست با موفقیت ثبت شد
    </h1>

    <p>
        کد پیگیری شما:
    </p>

    <div
        style="
            font-size:42px;
            font-weight:bold;
            letter-spacing:8px;
            margin:20px 0;
        "
    >
        {{ tracking_code }}
    </div>

    <p>
        این کد را برای پیگیری پرونده نزد خود نگه دارید.
    </p>


    <a
        href="{{ url_for(
            'tracking',
            code=tracking_code
        ) }}"
        class="btn btn-success"
    >
        🔎 مشاهده وضعیت پرونده
    </a>


    <a
        href="{{ url_for('home') }}"
        class="btn btn-secondary"
    >
        🏠 صفحه اصلی
    </a>

</div>

{% endblock %}
