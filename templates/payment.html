{% extends "base.html" %}
{% block title %}پرداخت{% endblock %}
{% block content %}
<div class="card">
  <h1>پرداخت</h1>
  <p>کد پیگیری: <strong>{{ req.tracking_code }}</strong></p>
  <p>خدمت: {{ req.service_name }}</p>
  <p>مبلغ: <strong>{{ "{:,}".format(req.total_price or 0) }}</strong> تومان</p>
  <form method="POST">
    <button type="submit" class="btn btn-success">تأیید پرداخت (شبیه‌سازی درگاه)</button>
  </form>
</div>
{% endblock %}
