{% extends "base.html" %}

{% block content %}

<div class="card" style="max-width:500px;margin:40px auto;">

    <h1>🔐 ورود مدیریت</h1>

    <p>
        برای ورود به پنل مدیریت، اطلاعات ورود را وارد کنید.
    </p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="notice" style="margin:10px 0;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}


    <form
        method="post"
        action="{{ url_for('admin_login') }}"
    >

        <div class="field">

            <label>
                نام کاربری
            </label>

            <input
                type="text"
                name="username"
                autocomplete="username"
                required
                placeholder="نام کاربری"
            >

        </div>


        <div class="field">

            <label>
                رمز عبور
            </label>

            <input
                type="password"
                name="password"
                autocomplete="current-password"
                required
                placeholder="رمز عبور"
            >

        </div>


        <button
            class="btn"
            type="submit"
            style="width:100%;"
        >
            🔑 ورود به پنل مدیریت
        </button>

    </form>

</div>

{% endblock %}
