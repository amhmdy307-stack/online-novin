{% extends "base.html" %}
{% block body_class %}admin-page{% endblock %}
{% block title %}ورود مدیریت{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>ورود پنل مدیریت</h1>
  <form method="POST">
    <label>نام کاربری</label>
    <input type="text" name="username" required>
    <label>رمز عبور</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn">ورود</button>
  </form>
  <p style="margin-top:12px;">
    <a href="{{ url_for('forgot_password') }}">فراموشی رمز</a> |
    <a href="{{ url_for('forgot_username') }}">فراموشی نام کاربری</a>
  </p>
  <p style="margin-top:10px;">
    <a class="btn btn-secondary" href="{{ url_for('register_request') }}">درخواست عضویت کاربر</a>
  </p>
</div>
{% endblock %}
