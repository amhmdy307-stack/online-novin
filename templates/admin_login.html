{% extends "base.html" %}

{% block title %}
ورود مدیریت
{% endblock %}

{% block content %}

<div
    class="card"
    style="max-width:500px;margin:auto;"
>

    <h1>
        🔐 ورود به پنل مدیریت
    </h1>

    <form
        method="POST"
    >

        <label>
            نام کاربری
        </label>

        <input
            type="text"
            name="username"
            required
            autocomplete="username"
        >


        <label>
            رمز عبور
        </label>

        <input
            type="password"
            name="password"
            required
            autocomplete="current-password"
        >


        <button
            type="submit"
            class="btn"
        >
            ورود
        </button>

    </form>

</div>

{% endblock %}
