{% extends "base.html" %}

{% block title %}ورود مدیریت{% endblock %}

{% block content %}

<div class="card" style="max-width:480px;margin:40px auto;">
    <h1 style="text-align:center;">ورود به پنل مدیریت</h1>
    <p style="text-align:center; color:#6b7280;">کافی نت آنلاین نوین</p>

    <form method="POST">
        <label>نام کاربری</label>
        <input type="text" name="username" required autocomplete="username" placeholder="نام کاربری">

        <label>رمز عبور</label>
        <input type="password" name="password" required autocomplete="current-password" placeholder="رمز عبور">

        <button type="submit" class="btn" style="width:100%;">ورود به پنل</button>
    </form>
</div>

{% endblock %}
