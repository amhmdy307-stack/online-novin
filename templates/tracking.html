{% extends "base.html" %}

{% block title %}
پیگیری درخواست
{% endblock %}


{% block content %}

<div class="card">

<h1>
🔎 پیگیری درخواست
</h1>


<form method="POST" action="{{ url_for('tracking') }}">

<label>
کد پیگیری ۴ رقمی
</label>


<input
type="text"
name="tracking_code"
maxlength="4"
minlength="4"
inputmode="numeric"
required
placeholder="مثلاً 4821"
>


<button class="btn" type="submit">
پیگیری
</button>


</form>


{% if error %}

<div class="alert">
{{ error }}
</div>

{% endif %}


</div>

{% endblock %}
