<!doctype html>
<html lang="fa" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
{% block title %}
{{ site.site_name }}
{% endblock %}
</title>

<style>

:root{
    --green:#3f5f32;
    --green2:#526f3a;
    --dark:#263b20;
    --light:#eef2ea;
    --border:#d5ddcf;
    --white:#fff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--light);
    color:#263126;
    font-family:Tahoma,Arial,sans-serif;
}

header{
    background:linear-gradient(135deg,var(--dark),var(--green));
    color:#fff;
    text-align:center;
    padding:24px 15px;
}

header img{
    width:90px;
    height:90px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    padding:5px;
}

header h1{
    margin:12px 0 5px;
    font-size:22px;
}

header p{
    margin:0;
    opacity:.9;
}

main{
    max-width:900px;
    margin:auto;
    padding:18px 12px 40px;
}

.quick{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
}

.quick a{
    background:var(--green);
    color:#fff;
    text-decoration:none;
    text-align:center;
    padding:11px 8px;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
}

.quick a:hover{
    background:var(--dark);
}

.notice{
    background:#fff8df;
    border:1px solid #e8d99b;
    border-radius:12px;
    padding:12px;
    margin-bottom:18px;
    font-size:13px;
}

.card{
    background:#fff;
    border:1px solid var(--border);
    border-radius:15px;
    padding:17px;
    margin-bottom:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.card h2,
.card h3{
    color:var(--dark);
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    border:1px solid #cbd5c4;
    border-radius:8px;
    font-family:inherit;
    margin:5px 0 10px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.btn{
    display:inline-block;
    width:100%;
    background:var(--green);
    color:#fff;
    text-decoration:none;
    text-align:center;
    border:0;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:var(--dark);
}

.btn-secondary{
    background:#687782;
}

.btn-success{
    background:#3f6f42;
}

.badge{
    display:inline-block;
    background:#e4eadf;
    color:var(--dark);
    border-radius:20px;
    padding:5px 10px;
    font-size:12px;
}

.price{
    margin-top:12px;
    padding:12px;
    background:#f2f6ef;
    border-radius:10px;
    font-weight:bold;
}

.icon-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.icon-card{
    display:block;
    text-decoration:none;
    color:#263126;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:center;
    background:#fafcf9;
}

.icon{
    font-size:28px;
    margin-bottom:8px;
}

.mini{
    font-size:12px;
    color:#687568;
    margin-top:6px;
}

hr{
    border:0;
    border-top:1px solid var(--border);
    margin:18px 0;
}

@media(max-width:500px){

    .quick{
        grid-template-columns:1fr 1fr;
    }

    header h1{
        font-size:19px;
    }

}

</style>

{% block head %}{% endblock %}

</head>

<body>

<header>

{% if site.logo %}

<img
    src="{{ url_for('static', filename=site.logo) }}"
    alt="لوگو"
>

{% endif %}

<h1>
{{ site.site_name }}
</h1>

<p>
با مدیریت : {{ site.manager }}
</p>

</header>

<main>

<div class="quick">

<a href="{{ url_for('tracking') }}">
🔎 پیگیری درخواست
</a>

<a href="{{ url_for('support') }}">
💬 ارتباط با پشتیبانی
</a>

</div>

{% if site.warning_text %}

<div class="notice">
⚠️ {{ site.warning_text }}
</div>

{% endif %}

{% block content %}{% endblock %}

</main>

</body>
</html>
