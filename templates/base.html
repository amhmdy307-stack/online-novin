<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="enamad" content="17886038" />

    <title>
        {% block title %}
        {{ site_name|default("کافی نت آنلاین نوین") }}
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.06);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-family: inherit;
            margin-bottom: 15px;
            background: white;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button,
        .btn {
            display: inline-block;
            border: 0;
            border-radius: 9px;
            padding: 11px 17px;
            cursor: pointer;
            font-family: inherit;
            background: #166534;
            color: white;
        }

        .btn-success {
            background: #16a34a;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-warning {
            background: #d97706;
        }

        .btn-secondary {
            background: #475569;
        }

        .alert {
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            background: #e0f2fe;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
        }

        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            background: #e5e7eb;
            font-size: 13px;
        }

        .status {
            font-weight: bold;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: right;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .chat {
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .message {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 10px;
            max-width: 85%;
        }

        .message-customer {
            background: #dbeafe;
            margin-left: auto;
        }

        .message-admin {
            background: #dcfce7;
            margin-right: auto;
        }

        footer {
            margin-top: 40px;
            padding: 25px;
            background: #166534;
            color: white;
            text-align: center;
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 15px;
            }

            table {
                min-width: 700px;
            }
        }
    </style>

    {% block head %}{% endblock %}
</head>

<body>

<main class="container">

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert
                    {% if category == 'error' %}
                        alert-error
                    {% elif category == 'success' %}
                        alert-success
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

</main>

<footer>
    تمامی حقوق محفوظ است
</footer>

{% block scripts %}{% endblock %}

</body>
</html>
