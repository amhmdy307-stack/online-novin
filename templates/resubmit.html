{% extends "base.html" %}
{% block title %}اصلاح پرونده{% endblock %}
{% block content %}
<div class="card">
    <h1>اصلاح نقص مدارک</h1>
    <p>کد: {{ req.tracking_code }} | {{ req.service_name }}</p>
    {% if req.admin_note %}<div class="alert">{{ req.admin_note }}</div>{% endif %}
</div>
<div class="card">
    <form method="POST" enctype="multipart/form-data">
        {% for key, value in form_data.items() %}
        <label style="{% if key in rejected %}color:red;font-weight:bold;{% endif %}">{{ key }}{% if key in rejected %} (نیاز به اصلاح){% endif %}</label>
        <input type="text" name="fix_{{ key }}" value="{{ value }}" {% if key in rejected %}style="border-color:red;"{% endif %}>
        {% endfor %}
        <label>توضیحات</label>
        <textarea name="customer_note"></textarea>
        <label>مدارک جدید</label>
        <input type="file" name="documents" multiple accept=".jpg,.jpeg,.png,.webp,.pdf">
        <button type="submit" class="btn btn-success">ارسال رایگان</button>
    </form>
</div>
{% endblock %}
