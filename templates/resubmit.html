{% extends "base.html" %}
{% block title %}رفع نقص{% endblock %}
{% block content %}
<div class="card">
  <h1>رفع نقص مدارک — {{ req.tracking_code }}</h1>
  <form method="POST" enctype="multipart/form-data">
    {% for key, value in form_data.items() %}
    <label>{{ key }}{% if key in rejected %} <span style="color:red;">(نیاز به اصلاح)</span>{% endif %}</label>
    <input type="text" name="form_{{ key }}" value="{{ value }}">
    {% endfor %}
    <label>توضیح</label>
    <textarea name="customer_note"></textarea>
    <label>مدارک جدید</label>
    <input type="file" name="documents" multiple accept=".jpg,.jpeg,.png,.webp,.pdf">
    <button type="submit" class="btn btn-success">ارسال مجدد</button>
  </form>
</div>
{% endblock %}
