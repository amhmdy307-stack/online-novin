{% extends "base.html" %}
{% block title %}پشتیبانی{% endblock %}
{% block content %}
<div class="card">
    <h1>ارتباط با پشتیبانی</h1>
    <p>زمان پاسخگویی امروز: <strong>{{ work_hours_text }}</strong></p>
</div>
{% if within_hours %}
<div class="card">
    <form method="POST" enctype="multipart/form-data">
        <select name="expert_id">
            <option value="">انتخاب کارشناس/مدیر</option>
            {% for e in experts %}
            <option value="{{ e['id'] }}">{{ e["username"] }}{% if e["role"]=="admin" %} (مدیر){% endif %}</option>
            {% endfor %}
        </select>
        <input type="text" name="name" required placeholder="نام">
        <input type="tel" name="phone" required placeholder="09...">
        <textarea name="message" required placeholder="پیام"></textarea>
        <input type="file" name="file" accept=".jpg,.jpeg,.png,.webp,.pdf">
        <button class="btn" type="submit" style="width:100%;">ارسال</button>
    </form>
</div>
{% else %}
<div class="card"><div class="alert alert-error">ساعت کاری به اتمام رسیده. امروز: {{ work_hours_text }}</div></div>
{% endif %}
<a class="btn btn-secondary" href="{{ url_for('home') }}">بازگشت</a>
{% endblock %}
