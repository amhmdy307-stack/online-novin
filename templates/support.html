{% extends "base.html" %}

{% block title %}ارتباط با پشتیبانی{% endblock %}

{% block content %}
<div class="card">
    <h2>ارتباط با پشتیبانی</h2>
    <p style="margin-bottom:15px;">کارشناس یا مدیر مورد نظر خود را انتخاب کنید:</p>

    <form method="POST">
        <label>انتخاب کارشناس / مدیر</label>
        <select name="expert_id" required>
            <option value="">انتخاب کنید...</option>
            {% for exp in experts %}
            <option value="{{ exp.id }}">
                {{ exp.username }} {% if exp.role == 'admin' %}(مدیر){% else %}(کارشناس){% endif %}
            </option>
            {% endfor %}
        </select>

        <label>نام و نام خانوادگی</label>
        <input type="text" name="name" required placeholder="نام کامل">

        <label>شماره موبایل</label>
        <input type="tel" name="phone" required placeholder="09xxxxxxxxx">

        <label>پیام شما</label>
        <textarea name="message" required rows="4" placeholder="پیام خود را بنویسید..."></textarea>

        <button type="submit" class="btn" style="width:100%;">ارسال پیام</button>
    </form>
</div>
{% endblock %}
