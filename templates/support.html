{% extends "base.html" %}
{% block title %}ارتباط با پشتیبانی{% endblock %}
{% block content %}
<div class="card">
  <a href="{{ url_for('index') }}" class="btn btn-secondary">بازگشت</a>
  <h1>ارتباط با پشتیبانی</h1>
  <form method="POST">
    <label>انتخاب کارشناس / مدیر</label>
    <select name="expert_id" required>
      <option value="">انتخاب کنید</option>
      {% for e in experts %}
      <option value="{{ e.id }}">{{ e.full_name or e.username }} ({{ e.role }})</option>
      {% endfor %}
    </select>
    <label>نام شما</label>
    <input type="text" name="name" required>
    <label>تلفن</label>
    <input type="text" name="phone" required>
    <label>پیام</label>
    <textarea name="message" required></textarea>
    <button type="submit" class="btn">ارسال</button>
  </form>
</div>
{% endblock %}
